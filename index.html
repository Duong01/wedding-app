<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ngày Chung Đôi — Thiệp cưới online</title>

    <!-- ==========================================================
         FONTS DÙNG CHUNG TOÀN ỨNG DỤNG
         - Be Vietnam Pro     : giao diện ứng dụng (UI sans, hỗ trợ tiếng Việt)
         - Lora               : nội dung thân bài thiệp (serif hiện đại)
         - Cormorant Garamond : tiêu đề phụ, nội dung thiệp
         - Playfair Display   : tiêu đề lớn của trang ứng dụng
         - Allura             : chữ ký / điểm nhấn script
         - Great Vibes        : chữ ký trong một số theme thiệp
         - Noto Serif SC      : ký tự 囍 (--font-symbol) — Google Fonts
                                tự chia subset theo unicode-range nên chỉ
                                tải đúng vài glyph needed
         - EB Garamond        : tên cô dâu chú rể trong theme TraditionalRed
         - The Nautigal       : tên script trên thiệp TraditionalRed
         - Pattaya            : tiêu đề Sổ lưu bút (TraditionalRed)
    =========================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Noto+Serif+SC:wght@400;600;700&family=Pattaya&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=The+Nautigal:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
