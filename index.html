<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thiệp Nhà Mình | Nơi Lưu Giữ Ngày Chung Đôi</title>

    <meta
      name="description"
      content="Khám phá mẫu thiệp cưới online đẹp, hiện đại và tinh tế tại Thiệp Nhà Mình. Tạo thiệp cưới điện tử mang dấu ấn riêng, dễ chia sẻ cùng người thân và bạn bè."
    />

    <meta name="theme-color" content="#a63a2e" />
    <script>
      (function () {
        try {
          /* ---- Migration khóa cố định ---- */
          var FIXED = {
            "thiepduyen:theme": "thiepnhaminh:theme",
            "thiepduyen-locale": "thiepnhaminh-locale",
            "thiepduyen:myWeddingCount": "thiepnhaminh:myWeddingCount",
          };

          Object.keys(FIXED).forEach(function (oldKey) {
            var value = localStorage.getItem(oldKey);

            if (value !== null) {
              if (localStorage.getItem(FIXED[oldKey]) === null) {
                localStorage.setItem(FIXED[oldKey], value);
              }

              localStorage.removeItem(oldKey);
            }
          });

          /* ---- Migration khóa có tiền tố (prize-claimed:{slug}) ---- */
          var PREFIX_OLD = "thiepduyen:prize-claimed:";
          var PREFIX_NEW = "thiepnhaminh:prize-claimed:";
          var stale = [];
          var i;

          for (i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);

            if (key && key.indexOf(PREFIX_OLD) === 0) {
              var newKey = PREFIX_NEW + key.slice(PREFIX_OLD.length);

              if (localStorage.getItem(newKey) === null) {
                localStorage.setItem(newKey, localStorage.getItem(key));
              }

              stale.push(key);
            }
          }

          stale.forEach(function (key) {
            localStorage.removeItem(key);
          });

          /* ---- Áp theme (khóa mới) ---- */
          if (localStorage.getItem("thiepnhaminh:theme") === "dark") {
            document.documentElement.classList.add("theme-dark");
          }
        } catch (error) {}
      })();
    </script>

    <!--
