<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thiệp Duyên |Thiệp cưới online - Lưu giữ ngày mình thuộc về nhau</title>

    <meta
      name="description"
      content="Thiệp Duyên giúp bạn tạo thiệp cưới online đẹp chỉ trong vài phút: chọn mẫu, điền thông tin, gửi khách mời qua link hoặc mã QR. Tạo miễn phí, dùng thử 3 ngày, ưng mới thanh toán."
    />

    <meta name="theme-color" content="#a63a2e" />

    <!--
      Áp theme tối TRƯỚC khi CSS tải — tránh chớp nền sáng khi
      người dùng đã chọn tối. Key localStorage phải khớp store
      theme (thiepduyen:theme). Mặc định là sáng.
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("thiepduyen:theme") === "dark") {
            document.documentElement.classList.add("theme-dark");
          }
        } catch (error) {}
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thiệp Duyên" />
    <meta
      property="og:title"
      content="Thiệp Duyên |Thiệp cưới online đẹp, tạo thiệp cưới điện tử miễn phí"
    />
    <meta
      property="og:description"
      content="Thiệp cưới online – Trao lời yêu, gửi một đời duyên. Chọn mẫu, điền nội dung, gửi khách mời trong vài phút."
    />
    <meta property="og:url" content="https://thiepduyen.vn/" />

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Font Google nạp ĐỘNG theo trang đang mở (xem
      src/utils/fontLoader.js + src/data/themeFonts.js):
      khung app nạp 7 font lõi lúc khởi động, theme thiệp nạp
      đúng 2-3 font của theme đó. Trước đây chèn sẵn 25 font
      (~40 file woff2) ở đây — khách mời mở thiệp phải tải
      cả đám font không bao giờ dùng tới.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
